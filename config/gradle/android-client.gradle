// Both Android hosts compile the same client. Each contributes its own manifest and entry point.
android.sourceSets.main {
    ['src/runtime', 'src/storage', 'src/screens', 'components/compose',
     'lib/algorithm', 'lib/model', 'lib/repository', 'lib/service'].each { location ->
        java.srcDir new File(clientRoot, location)
    }
    res.srcDir new File(clientRoot, 'assets/android/res')
    assets.srcDir new File(clientRoot, 'assets/android/assets')
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.compose.ui:ui:1.7.5'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.5'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.material:material-icons-extended:1.7.5'
    implementation 'androidx.navigation:navigation-compose:2.8.4'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'com.google.code.gson:gson:2.10.1'
}
