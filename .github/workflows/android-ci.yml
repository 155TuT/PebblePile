name: Android CI

on:
  push:
    branches:
      - main
    paths: &client_paths
      - "android/**"
      - "src/**"
      - "lib/**"
      - "utils/**"
      - "config/**"
      - "components/**"
      - "modules/**"
      - "assets/android/**"
      - "scripts/gradle.py"
      - "package*.json"
      - "tsconfig.json"
      - "app.json"
      - "metro.config.js"
      - "*.ts"
      - "*.tsx"
      - "test/**"
      - "docs/user-research.md"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"
      - ".github/scripts/android-*"
  pull_request:
    paths: *client_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo:
    name: Check Expo development client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Generate Android host from a clean checkout
        run: |
          test -z "$(git ls-files -- android)"
          npx expo prebuild --platform android --no-install
          test -f android/app/src/main/AndroidManifest.xml
      - run: npx expo export --platform android --output-dir "$RUNNER_TEMP/pebblepile-bundle"

  build-debug:
    name: Build and check debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check candidate promotion
        run: python3 -m unittest discover -s test/release -p test_android_promotion.py

      - name: Verify shared dinner fixtures
        run: python3 test/fixtures/issue10/check_fixtures.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages for the debug build
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Build, test and lint
        run: |
          python3 scripts/gradle.py --no-daemon \
            :scheduler-core:test :scheduler-android:testDebugUnitTest :scheduler-android:assembleDebug :scheduler-android:lintDebug \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify debug APK and source revision
        run: |
          apk_dir=build/native/app/outputs/apk
          test ! -e "$apk_dir/androidTest"
          version_name="$(sed -n 's/^versionName=//p' config/version.properties)+$(git rev-parse --short=12 HEAD)"
          version_code="$(sed -n 's/^versionCode=//p' config/version.properties)"
          badging="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk_dir/debug/app-debug.apk")"
          grep -F "package: name='com.pebblepile.android' versionCode='$version_code' versionName='$version_name'" <<< "$badging"

      - name: Upload JVM test report
        if: ${{ !cancelled() && hashFiles('build/native/*/test-results/*/TEST-*.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report-${{ github.sha }}
          path: |
            build/native/scheduler-core/test-results/test/TEST-*.xml
            build/native/scheduler-android/test-results/testDebugUnitTest/TEST-*.xml
            build/native/app/reports/tests/testDebugUnitTest/
            build/native/app/test-results/testDebugUnitTest/TEST-*.xml
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pebblepile-debug-${{ github.sha }}
          path: build/native/app/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
