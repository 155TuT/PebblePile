name: Android release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "candidate 构建并验证新 APK；promote 原样发布已验收的候选包"
        required: true
        type: choice
        default: candidate
        options:
          - candidate
          - promote
      publish:
        description: "candidate 模式下，CI 验证后立即创建预发布；外部验收请保持 false 后使用 promote"
        required: true
        type: boolean
        default: false
      source_run_id:
        description: "promote 模式：已验收候选包的 Actions run ID"
        required: false
        type: string
      source_artifact:
        description: "promote 模式：已验收候选包的 Actions artifact 名称"
        required: false
        type: string
      expected_sha256:
        description: "promote 模式：验收时记录的 APK SHA-256（可留空）"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: android-release-${{ inputs.mode }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build signed candidate
    if: inputs.mode == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out candidate commit
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^versionName=//p' android/version.properties)"
          version_code="$(sed -n 's/^versionCode=//p' android/version.properties)"

          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid versionName in android/version.properties: $version_name" >&2
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "versionCode must be a positive integer: $version_code" >&2
            exit 1
          fi

          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Prepare release keystore
        shell: bash
        env:
          PEBBLEPILE_KEYSTORE_BASE64: ${{ secrets.PEBBLEPILE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${PEBBLEPILE_KEYSTORE_BASE64:-}" ]]; then
            echo "Missing repository secret PEBBLEPILE_KEYSTORE_BASE64." >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/pebblepile-release.jks"
          printf '%s' "$PEBBLEPILE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "PEBBLEPILE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build dependencies
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        working-directory: android
        env:
          PEBBLEPILE_KEYSTORE_PASSWORD: ${{ secrets.PEBBLEPILE_KEYSTORE_PASSWORD }}
          PEBBLEPILE_KEY_ALIAS: ${{ secrets.PEBBLEPILE_KEY_ALIAS }}
          PEBBLEPILE_KEY_PASSWORD: ${{ secrets.PEBBLEPILE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleRelease

      - name: Verify package and create checksums
        working-directory: android
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          apk_source="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk_source"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk_source" | tee "$RUNNER_TEMP/apk-certificate.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/apk-certificate.txt"; then
            echo "Refusing to release an APK signed with the Android debug certificate." >&2
            exit 1
          fi

          badging="$("$aapt" dump badging "$apk_source")"
          grep -F "versionCode='$VERSION_CODE'" <<< "$badging"
          grep -F "versionName='$VERSION_NAME'" <<< "$badging"

          mkdir -p ../dist
          apk_name="PebblePile-${VERSION_NAME}.apk"
          cp "$apk_source" "../dist/$apk_name"
          (
            cd ../dist
            sha256sum "$apk_name" > SHA256SUMS.txt
          )

          cat > ../dist/build-info.json <<EOF
          {
            "schemaVersion": 1,
            "applicationId": "com.pebblepile.android",
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "commit": "$GITHUB_SHA",
            "workflowRunId": "$GITHUB_RUN_ID",
            "workflowRunAttempt": "$GITHUB_RUN_ATTEMPT",
            "apk": "$apk_name",
            "sha256": "$(cut -d' ' -f1 ../dist/SHA256SUMS.txt)"
          }
          EOF

          echo "APK_PATH=$GITHUB_WORKSPACE/dist/$apk_name" >> "$GITHUB_ENV"
          echo "APK_FILE=$apk_name" >> "$GITHUB_ENV"

      - name: Run connected tests and signed APK smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}/android"
            ./gradlew --no-daemon :app:connectedDebugAndroidTest

            adb uninstall com.pebblepile.android >/dev/null 2>&1 || true
            adb install -r "$APK_PATH"
            adb shell pm clear com.pebblepile.android
            adb shell am start -W -n com.pebblepile.android/.MainActivity
            sleep 5
            pid="$(adb shell pidof com.pebblepile.android | tr -d '\r')"
            test -n "$pid"

      - name: Write release notes
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          sha256="$(cut -d' ' -f1 dist/SHA256SUMS.txt)"
          cat > dist/release-notes.md <<EOF
          # PebblePile Android ${VERSION_NAME}

          提交：\`${GITHUB_SHA}\`

          - versionName：\`${VERSION_NAME}\`
          - versionCode：\`${VERSION_CODE}\`
          - 构建环境：JDK 17、Gradle Wrapper 8.9、Android SDK 35
          - 最低 Android：8.0（API 26）
          - APK SHA-256：\`${sha256}\`

          ## 安装

          \`\`\`text
          adb install -r ${APK_FILE}
          \`\`\`

          若设备已安装使用另一签名的同包名版本，请先备份测试数据再卸载旧包。

          ## 构建信息

          - GitHub Actions run：\`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\`
          - 构建流程：\`.github/workflows/android-release.yml\`
          - 校验文件：\`SHA256SUMS.txt\`
          EOF

          test -f android/release-notes.md
          printf '\n' >> dist/release-notes.md
          cat android/release-notes.md >> dist/release-notes.md

      - name: Upload signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: PebblePile-android-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish candidate prerelease
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_NAME" =~ -(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Candidate publication requires an alpha, beta or rc version." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "dist/$APK_FILE" \
            dist/SHA256SUMS.txt \
            dist/build-info.json \
            dist/release-notes.md \
            --target "$GITHUB_SHA" \
            --title "PebblePile Android ${VERSION_NAME}" \
            --notes-file dist/release-notes.md \
            --prerelease

      - name: Write candidate handoff
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          artifact_name="PebblePile-android-${VERSION_NAME}-${GITHUB_SHA}"
          sha256="$(cut -d' ' -f1 dist/SHA256SUMS.txt)"
          {
            echo "## Android candidate"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: \`${VERSION_NAME}\`"
            echo "- Run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Artifact: \`${artifact_name}\`"
            echo "- APK SHA-256: \`${sha256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote tested candidate
    if: inputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate promotion inputs
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "source_run_id must be a numeric Actions run ID." >&2
            exit 1
          fi
          if [[ -z "$SOURCE_ARTIFACT" ]]; then
            echo "source_artifact is required in promote mode." >&2
            exit 1
          fi

      - name: Download exact candidate artifact
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir dist

          test -f dist/SHA256SUMS.txt
          test -f dist/build-info.json
          test -f dist/release-notes.md
          (
            cd dist
            sha256sum --check SHA256SUMS.txt
          )

          version_name="$(jq -r '.versionName' dist/build-info.json)"
          commit="$(jq -r '.commit' dist/build-info.json)"
          sha256="$(jq -r '.sha256' dist/build-info.json)"
          sum_sha256="$(cut -d' ' -f1 dist/SHA256SUMS.txt)"
          run_commit="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')"
          run_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion')"
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Promote mode requires a final, alpha, beta or rc version." >&2
            exit 1
          fi
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Candidate build-info.json contains an invalid commit." >&2
            exit 1
          fi
          if [[ "$run_conclusion" != "success" || "$run_commit" != "$commit" ]]; then
            echo "Candidate run is not successful or does not match build-info.json commit." >&2
            exit 1
          fi
          if [[ "$sha256" != "$sum_sha256" ]]; then
            echo "build-info.json SHA-256 does not match SHA256SUMS.txt." >&2
            exit 1
          fi
          test -f "dist/PebblePile-${version_name}.apk"
          if [[ -n "$EXPECTED_SHA256" && "${EXPECTED_SHA256,,}" != "${sha256,,}" ]]; then
            echo "Expected SHA-256 does not match the candidate artifact." >&2
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Publish tested candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.candidate.outputs.version_name }}
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
          SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          tag="v$VERSION_NAME"
          if [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_flag="--latest"
          else
            release_flag="--prerelease"
          fi
          gh release create "$tag" \
            "dist/PebblePile-${VERSION_NAME}.apk" \
            dist/SHA256SUMS.txt \
            dist/build-info.json \
            dist/release-notes.md \
            --target "$CANDIDATE_COMMIT" \
            --title "PebblePile Android ${VERSION_NAME}" \
            --notes-file dist/release-notes.md \
            "$release_flag"

          {
            echo "### Release published"
            echo
            echo "- Release tag: \`${tag}\`"
            echo "- Commit: \`${CANDIDATE_COMMIT}\`"
            echo "- APK SHA-256: \`${SHA256}\`"
            echo "- The APK was promoted from the tested Actions artifact without rebuilding."
          } >> "$GITHUB_STEP_SUMMARY"
